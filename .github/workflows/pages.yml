name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up bikeshed venv
        run: |
          python3 -m venv bsvenv
          bsvenv/bin/pip install --upgrade pip
          bsvenv/bin/pip install bikeshed==7.1.2
          bsvenv/bin/bikeshed update

      - name: Build every section standalone and the merged draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build.sh

      - name: Render landing page
        run: python3 tools/render_landing.py

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
